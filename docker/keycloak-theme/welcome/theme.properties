# Deliberately do NOT inherit from the built-in keycloak welcome theme: it sets
# redirectToAdmin=true, which makes / bounce to /admin/ once an admin user
# exists. WelcomeResource defaults this property to false, so an independent
# theme keeps the page served at http://localhost:8080/.
redirectToAdmin=false

# Static assets in resources/ are served under /welcome-content/<path>.
# Assets must sit FLAT in resources/: WelcomeResource serves them via
# @Path("/welcome-content/{path}"), and {path} matches a single segment only,
# so resources/js/offer.js would 404.
